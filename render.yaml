services:
  - type: web
    name: sparkpath
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_RESEARCH_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_MAX_OUTPUT_TOKENS
        value: "4000"
      - key: GROQ_RESEARCH_MAX_OUTPUT_TOKENS
        value: "5000"
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: GROQ_RESEARCH_REASONING_EFFORT
        value: low
      - key: GITHUB_TOKEN
        sync: false
